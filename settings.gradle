pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
        // Add the dependency for the Google services Gradle plugin
        id 'com.google.gms.google-services' version '4.4.2' apply false
        // Add the dependency for the Crashlytics Gradle plugin
        id 'com.google.firebase.crashlytics' version '3.0.3' apply false
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url 'https://mvnrepository.com/artifact/com.mobeta.android.dslv/library'
        }
        /*maven {
            url 'http://dl.bintray.com/amulyakhare/maven'
            allowInsecureProtocol(true) // Explicitly allow HTTP
        }*/
    }
}

rootProject.name = "PLAYit MusicPlayer"

include ':app', ':quickScroll', ':velocityviewpagerlibrary', ':viewpagerindicatorlibrary', ':picasso'
include ':drag_sort_library'
