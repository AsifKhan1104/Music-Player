apply plugin: 'android-library'

android {
    namespace 'com.velocity.view.pager.library'

    compileSdkVersion 25

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion 23
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    api 'com.android.support:support-v4:' + project.properties.SUPPORT_LIBRARY_VERSION
}
