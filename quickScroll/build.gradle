apply plugin: 'android-library'
android {
    namespace 'com.andraskindler.quickscroll'

    compileSdkVersion 25

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion 23
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation project(':picasso')
}